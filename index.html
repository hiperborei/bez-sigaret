.gt{font-size:1.5rem;font-weight:400;line-height:1.2}

.back{background:transparent;color:var(--mute);width:auto;padding:18px 0 4px;font-weight:400;letter-spacing:.02em}
.foot{margin-top:30px;color:var(--mute);font-size:.78rem;letter-spacing:.04em;text-align:center}

"], ["10 år", "Risken att dö i lungcancer är ungefär hälften så stor som hos en rökare."]],et:[["5 minutit", "Esimesed minutid on seljataga. Äge suitsutahe möödub tavaliselt lühikese ajaga ise."], ["10 minutit", "Suits on ammu hajunud. Sa ei suitseta, jätka samas vaimus."], ["15 minutit", "Peaaegu kohal: umbes 20 minuti pärast hakkavad pulss ja vererõhk langema."], ["30 minutit", "Pulss ja vererõhk langevad, kui nikotiini toime hääbub."], ["1 tund", "Tund aega ilma sigaretita. Keha hakkab aeglaselt taastuma."], ["3 tundi", "Vererõhk ja pulss on tavaliselt peaaegu normaalsed ning vereringe paraneb."], ["12 tundi", "Vere vingugaasi tase normaliseerub ja hapnikku on rohkem."], ["1 päev", "Infarktirisk on hakanud langema ja kopsud hakkavad puhastuma."], ["2 päeva", "Nikotiin lahkub organismist ning maitse- ja lõhnataju teravnevad."], ["3 päeva", "Tavaliselt on need võõrutuse kõige raskemad päevad. Sa saad neist läbi."], ["5 päeva", "Viis päeva järjest. Tavapärastes suitsetamiskohtades oled sigaretita hakkama saanud."], ["1 nädal", "Nädal ilma sigarettideta. Kõige raskem algus on seljataga."], ["10 päeva", "Kümme päeva. Loendis on kaks numbrit ja kokkuhoid kasvab."], ["2 nädalat", "Võõrutusnähud leevenevad enamikul inimestel ja hingata on kergem."], ["3 nädalat", "Kopsumaht suureneb ning süda ja vereringe töötavad paremini."], ["1 kuu", "Füüsiline koormus on kergem ja hingamine paraneb."], ["2 kuud", "Köha ja õhupuudus vähenevad edasi."], ["3 kuud", "Kopsud taastuvad: köha, vilistav hingamine ja hingamisraskused vähenevad."], ["100 päeva", "Sada päeva ilma sigarettideta. Harjumus on selgelt nõrgenenud."], ["6 kuud", "Pool aastat. Köha ja hingamisprobleemid vähenevad edasi."], ["1 aasta", "Südame isheemiatõve lisarisk on poole väiksem kui suitsetajal."], ["5 aastat", "Insuldirisk langeb edasi ja läheneb aja jooksul mittesuitsetaja omale."], ["10 aastat", "Kopsuvähki suremise risk on umbes poole väiksem kui suitsetajal."]],ru:[["5 минут", "Первые минуты позади. Острая тяга обычно длится недолго и проходит сама."], ["10 минут", "Дым давно выветрился. Вы уже не курите, просто продолжайте."], ["15 минут", "Ещё немного: примерно с 20-й минуты пульс и давление начинают снижаться."], ["30 минут", "Пульс и давление снижаются: организм отходит от стимулирующего действия никотина."], ["1 час", "Час без сигареты. Организм потихоньку восстанавливается."], ["3 часа", "Давление и пульс обычно возвращаются к почти нормальным значениям, улучшается кровообращение."], ["12 часов", "Уровень угарного газа в крови нормализуется, кислорода становится больше."], ["1 день", "Риск сердечного приступа уже начал снижаться, лёгкие начинают очищаться."], ["2 дня", "Никотин выводится из организма, вкус и запах становятся острее."], ["3 дня", "Именно в эти дни отвыкание обычно самое тяжёлое. Вы его проходите."], ["5 дней", "Пять дней подряд. Привычные ситуации вы уже встречаете без сигареты."], ["1 неделя", "Неделя без сигарет. Самое трудное начало позади."], ["10 дней", "Десять дней. Двузначное число в счётчике и растущая экономия."], ["2 недели", "Симптомы отвыкания у большинства людей слабеют, дышать становится легче."], ["3 недели", "Увеличивается объём лёгких, улучшаются работа сердца и кровообращение."], ["1 месяц", "Физические нагрузки даются легче, дыхание улучшается."], ["2 месяца", "Кашель и одышка продолжают уменьшаться."], ["3 месяца", "Лёгкие восстанавливаются: кашля, хрипов и проблем с дыханием становится меньше."], ["100 дней", "Сто дней без сигарет. Привычка заметно ослабла."], ["Полгода", "Полгода без сигарет. Кашель и проблемы с дыханием продолжают уменьшаться."], ["1 год", "Добавочный риск ишемической болезни сердца вдвое ниже, чем у курящего."], ["5 лет", "Риск инсульта продолжает снижаться и со временем приближается к уровню некурящего."], ["10 лет", "Риск смерти от рака лёгкого примерно вдвое ниже, чем у курящего."]],en:[["5 minutes", "The first minutes are behind you. An acute craving usually passes by itself within a short time."], ["10 minutes", "The smoke has long cleared. You are not smoking, just keep going."], ["15 minutes", "Almost there: around the 20-minute mark your pulse and blood pressure start to drop."], ["30 minutes", "Pulse and blood pressure are dropping as the effect of nicotine wears off."], ["1 hour", "One hour without a cigarette. Your body is slowly recovering."], ["3 hours", "Blood pressure and pulse usually return to near normal, and circulation improves."], ["12 hours", "Carbon monoxide in your blood returns to normal and you have more oxygen."], ["1 day", "The risk of heart attack has started to fall and your lungs begin to clear."], ["2 days", "Nicotine is leaving your body, and taste and smell get sharper."], ["3 days", "These are usually the hardest days of withdrawal. You are getting through them."], ["5 days", "Five days in a row. You are meeting your usual smoking situations without a cigarette."], ["1 week", "A week without cigarettes. The hardest part of the start is behind you."], ["10 days", "Ten days. Two digits on the counter and growing savings."], ["2 weeks", "Withdrawal symptoms ease for most people and breathing gets easier."], ["3 weeks", "Lung capacity increases and the heart and circulation work better."], ["1 month", "Exercise feels easier and your breathing improves."], ["2 months", "Cough and shortness of breath keep decreasing."], ["3 months", "Your lungs are recovering: less coughing, wheezing and breathing trouble."], ["100 days", "One hundred days without cigarettes. The habit has clearly weakened."], ["6 months", "Half a year. Cough and breathing problems keep decreasing."], ["1 year", "Your extra risk of coronary heart disease is half that of a smoker."], ["5 years", "Stroke risk keeps falling and over time approaches that of a non-smoker."], ["10 years", "Your risk of dying from lung cancer is roughly half that of a smoker."]],fil:[["5 minuto", "Nalampasan mo na ang unang mga minuto. Kadalasang saglit lang ang matinding gustong manigarilyo at kusa itong lilipas."], ["10 minuto", "Nawala na ang usok sa paligid. Hindi ka na nagyoyosi, ituloy mo lang."], ["15 minuto", "Konting tiis na lang: mga 20 minuto, magsisimulang bumaba ang pulso at presyon ng dugo."], ["30 minuto", "Bumababa ang pulso at presyon ng dugo habang nawawala ang epekto ng nikotina."], ["1 oras", "Isang oras nang walang yosi. Dahan-dahang bumabawi ang katawan mo."], ["3 oras", "Karaniwang bumabalik na sa halos normal ang presyon at pulso, at gumaganda ang daloy ng dugo."], ["12 oras", "Bumabalik sa normal ang carbon monoxide sa dugo at dumarami ang oxygen."], ["1 araw", "Nagsisimula nang bumaba ang panganib ng atake sa puso, at nagsisimulang luminis ang baga."], ["2 araw", "Lumalabas na sa katawan ang nikotina, at gumaganda ang panlasa at pang-amoy."], ["3 araw", "Kadalasan ito ang pinakamahirap na mga araw ng pagtigil. Nalalampasan mo ito."], ["5 araw", "Limang araw na tuloy-tuloy. Kaya mo nang harapin ang mga nakasanayang sitwasyon nang walang yosi."], ["1 linggo", "Isang linggo nang walang yosi. Lagpas na ang pinakamahirap na simula."], ["10 araw", "Sampung araw na. Dalawang digit na ang bilang at lumalaki na ang natitipid mo."], ["2 linggo", "Humuhupa na ang mga sintomas ng pagtigil sa karamihan ng tao, at mas madali nang huminga."], ["3 linggo", "Lumalaki ang kapasidad ng baga at gumaganda ang puso at daloy ng dugo."], ["1 buwan", "Mas madali na ang pag-eehersisyo at gumaganda ang paghinga."], ["2 buwan", "Patuloy na lumiliit ang ubo at hingal."], ["3 buwan", "Gumagaling ang baga: bumababa ang ubo, paghuni sa paghinga at hirap sa paghinga."], ["100 araw", "Sandaang araw nang walang yosi. Malaki na ang ibinaba ng bisyo."], ["6 na buwan", "Anim na buwan na. Patuloy na bumubuti ang ubo at paghinga."], ["1 taon", "Kalahati na lang ang dagdag na panganib sa sakit sa puso kumpara sa naninigarilyo."], ["5 taon", "Patuloy na bumababa ang panganib ng stroke, at sa paglipas ng panahon ay lumalapit sa antas ng hindi naninigarilyo."], ["10 taon", "Humigit-kumulang kalahati na lang ang panganib na mamatay sa kanser sa baga kumpara sa naninigarilyo."]]};

};
var NT={"ru": "Уведомлять о достижениях", "en": "Notify me about achievements", "fil": "Abisuhan ako sa mga tagumpay", "no": "Varsle meg om prestasjoner", "sv": "Meddela mig om prestationer", "et": "Teavita mind saavutustest", "de": "Bei Erfolgen benachrichtigen", "fr": "Me notifier des réussites"};for(var c in NT)T[c].notif=NT[c];
function detect(){var n=((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase();if(n.indexOf('nb')===0||n.indexOf('nn')===0||n.indexOf('no')===0)return 'no';if(n.indexOf('sv')===0)return 'sv';if(n.indexOf('et')===0)return 'et';if(n.indexOf('de')===0)return 'de';if(n.indexOf('fr')===0)return 'fr';if(n.indexOf('ru')===0)return 'ru';if(n.indexOf('fil')===0||n.indexOf('tl')===0)return 'fil';return 'en';}
var L=LN[S.lang]?S.lang:detect();
var app=document.getElementById('app');
var confirming=false,view='home',lastIdx=-1;
function $(id){return document.getElementById(id);}
function tt(k){return T[L][k];}
function f(k,o){return tt(k).replace(/\{(\w+)\}/g,function(_,x){return o[x];});}
function pl(a,n){if(L==='ru'){var x=Math.abs(n)%100,m=x%10;return x>10&&x<20?a[2]:(m>1&&m<5?a[1]:(m===1?a[0]:a[2]));}return n===1?a[0]:a[1];}
function pad(n){return n<10?'0'+n:''+n;}
function fmt(n){return Math.floor(n).toLocaleString(LC[L]);}
function localInput(ts){var d=new Date(ts-new Date(ts).getTimezoneOffset()*60000);return d.toISOString().slice(0,16);}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000));var d=Math.floor(s/86400);s-=d*86400;var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;return {d:d,h:h,m:m,s:s};}
function longDur(ms){var q=dur(ms),o=[];if(q.d)o.push(q.d+' '+pl(tt('day'),q.d));if(q.h)o.push(q.h+' '+tt('hr'));if(!q.d)o.push(q.m+' '+tt('mn'));return o.join(' ');}
function nextGoal(el){for(var i=0;i<GM.length;i++){if(el<GM[i][0]){return {t:GM[i][0],name:GD[L][i][0],txt:GD[L][i][1],prev:i?GM[i-1][0]:0};}}return null;}
function doneCount(el){var n=0;while(n<GM.length&&el>=GM[n][0])n++;return n;}
function applyLang(){document.documentElement.lang=L;document.title=tt('title');$('ttl').textContent=tt('title');$('tbtn').setAttribute('aria-label',tt('trophy'));$('lang').value=L;}

function render(){
 applyLang();
 $('tbtn').hidden=!S.last||view==='trophy';
 if(view==='trophy'&&S.last){renderTrophy();return;}
 if(!S.last){
  var now=localInput(Date.now());
  app.innerHTML='<div class="card"><p class="welcome">'+tt('ask')+'</p><p class="hint">'+tt('askHint')+'</p><label for="st">'+tt('when')+'</label><input id="st" type="datetime-local" max="'+now+'" value="'+now+'"><div style="height:10px"></div><button class="plain" id="now">'+tt('now')+'</button><div style="height:10px"></div><button class="primary" id="go">'+tt('go')+'</button></div>';
  $('now').onclick=function(){var n=localInput(Date.now()),i=$('st');i.max=n;i.value=n;};
  $('go').onclick=function(){var v=$('st').value;var t=v?new Date(v).getTime():Date.now();if(!t||t>Date.now())t=Date.now();S.last=t;save();render();};
  return;
 }
 app.innerHTML=
 '<div class="card"><div class="ringwrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--track)" stroke-width="10"/><circle id="ringfg" cx="100" cy="100" r="90" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5"/></svg>'+
 '<div class="in" role="timer" aria-live="off"><div class="days" id="d">0</div><div class="dl" id="dl"></div><div class="hms" id="hms">00:00:00</div></div></div>'+
 '<p class="goal" id="goal"></p><p class="hint" id="gtext" style="text-align:center;margin:4px 0 0"></p></div>'+
 '<div id="last"></div>'+
 '<div class="card"><div class="stats"><div class="stat"><div class="v" id="avoid">0</div><div class="l">'+tt('avoid')+'</div></div>'+
 '<div class="stat"><div class="v" id="money">—</div><div class="l" id="ml"></div></div>'+
 '<div class="stat"><div class="v" id="best">—</div><div class="l">'+tt('best')+'</div></div>'+
 '<div class="stat"><div class="v">'+S.resets+'</div><div class="l">'+pl(tt('slips'),S.resets)+'</div></div></div></div>'+
 '<div id="act"></div>'+
 '<div class="card"><details><summary>'+tt('settings')+'</summary>'+
 '<label for="pd">'+tt('perDay')+'</label><input id="pd" type="number" min="1" inputmode="numeric" value="'+S.perDay+'">'+
 '<label for="ps">'+tt('pack')+'</label><input id="ps" type="number" min="1" inputmode="numeric" value="'+S.packSize+'">'+
 '<label for="pp">'+tt('price')+'</label><input id="pp" type="number" min="0" step="0.01" inputmode="decimal" value="'+(S.price||'')+'">'+
 '<label for="pc">'+tt('cur')+'</label><input id="pc" type="text" maxlength="6" value="'+S.cur+'">'+
 '<label for="lt">'+tt('lastT')+'</label><input id="lt" type="datetime-local" value="'+localInput(S.last)+'">'+
 '<label class="chk"><input type="checkbox" id="nf"'+(S.notif?' checked':'')+'><span>'+tt('notif')+'</span></label><p class="hint">'+tt('local')+'</p></details></div>';
 ['pd','ps','pp','pc','lt'].forEach(function(id){$(id).onchange=onSettings;});$('nf').onchange=onNotif;
 lastIdx=-1;renderAct();tick();
}
function renderAct(){
 var a=$('act');
 if(!confirming){a.innerHTML='<button class="ghost" id="rs">'+tt('reset')+'</button>';$('rs').onclick=function(){confirming=true;renderAct();};}
 else{a.innerHTML='<div class="card"><p style="margin:0 0 12px"><b>'+tt('rq')+'</b> '+tt('rb')+'</p><div class="row"><button class="plain" id="no">'+tt('cancel')+'</button><button class="primary" id="yes">'+tt('doReset')+'</button></div></div>';
  $('no').onclick=function(){confirming=false;renderAct();};
  $('yes').onclick=function(){var el=Date.now()-S.last;if(el>S.best)S.best=el;S.resets++;S.last=Date.now();confirming=false;save();render();};}
}
function onSettings(){
 var pd=parseInt($('pd').value,10),ps=parseInt($('ps').value,10),pp=parseFloat($('pp').value);
 if(pd>0)S.perDay=pd;if(ps>0)S.packSize=ps;S.price=pp>0?pp:0;
 S.cur=($('pc').value||'').trim()||'kr';
 var lt=$('lt').value;if(lt){var t=new Date(lt).getTime();if(t&&t<=Date.now())S.last=t;}
 save();tick();
}
function onNotif(){
 var cb=$('nf');
 if(!cb.checked){S.notif=false;save();return;}
 try{
  if(!('Notification' in window)){cb.checked=false;S.notif=false;save();return;}
  var done=function(r){S.notif=(r==='granted');cb.checked=S.notif;save();};
  var p=Notification.requestPermission(done);
  if(p&&p.then)p.then(done);
 }catch(e){cb.checked=false;S.notif=false;save();}
}
function notify(i){
 if(!S.notif)return;
 try{if('Notification' in window&&Notification.permission==='granted'){new Notification(tt('newG')+': '+GD[L][i][0],{body:GD[L][i][1]});}}catch(e){}
}
function drawLast(n){
 var c=$('tcnt');if(c)c.textContent=f('of',{n:n,t:GM.length});
 var b=$('last');if(!b)return;
 if(!n){b.innerHTML='';return;}
 var g=GD[L][n-1];
 b.innerHTML='<div class="card"><p class="dl" style="margin:0 0 2px">'+tt('lastA')+'</p><div class="gt">'+g[0]+'</div><p style="margin:4px 0 0">'+g[1]+'</p></div>';
}
function toast(i){
 var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=tt('newG')+': '+GD[L][i][0]+'. '+GD[L][i][1];
 app.insertBefore(t,app.firstChild);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},10000);
}
function renderTrophy(){
 var el=Date.now()-S.last,n=doneCount(el);
 var h='<button class="back" id="bk">'+tt('back')+'</button><div class="card"><p class="welcome" style="margin:0 0 4px">'+tt('trophy')+'</p><p class="hint" style="margin:0 0 6px">'+f('sum',{n:n,t:GM.length})+'</p>';
 GM.forEach(function(g,i){
  var st=i<n?'done':(i===n?'next':'todo'),G=GD[L][i];
  var sub=i<n?f('reached',{d:new Date(S.last+g[0]).toLocaleString(LC[L],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}):f('rem',{d:longDur(g[0]-el)});
  h+='<div class="ms '+st+'"><div class="ic">'+(i<n?'✓':(i+1))+'</div><div><div class="t">'+G[0]+'</div><div>'+G[1]+'</div>'+(g[1]?'<div class="d">'+tt('res')+'</div>':'')+'<div class="d">'+sub+'</div></div></div>';
 });
 h+='<p class="hint" style="margin:12px 0 0">'+tt('foot')+'</p></div>';
 app.innerHTML=h;
 $('bk').onclick=function(){view='home';window.scrollTo(0,0);render();};
}
function tick(){
 if(!S.last||!$('d'))return;
 var el=Math.max(0,Date.now()-S.last),q=dur(el);
 $('d').textContent=q.d;$('dl').textContent=pl(tt('day'),q.d);
 $('hms').textContent=pad(q.h)+':'+pad(q.m)+':'+pad(q.s);
 var g=nextGoal(el),ring=$('ringfg'),goal=$('goal');
 if(g){var pr=(el-g.prev)/(g.t-g.prev);ring.setAttribute('stroke-dashoffset',(565.5*(1-pr)).toFixed(1));goal.innerHTML=f('goal',{g:g.name,d:longDur(g.t-el)});$('gtext').textContent=g.txt;}
 else{ring.setAttribute('stroke-dashoffset','0');goal.innerHTML='<b>'+tt('all')+'</b> '+tt('allSub');$('gtext').textContent='';}
 var n=doneCount(el);if(n!==lastIdx){var first=lastIdx<0;lastIdx=n;drawLast(n);if(first){if(S.seen<0)S.seen=n;if(n>S.seen&&n>0)toast(n-1);S.seen=n;save();}else if(n>0){toast(n-1);notify(n-1);S.seen=n;save();}}
 var av=el/D*S.perDay;$('avoid').textContent=fmt(av);
 if(S.price>0){$('money').textContent=fmt(av/S.packSize*S.price)+' '+S.cur;$('ml').textContent=tt('saved');}else{$('money').textContent='—';$('ml').textContent=tt('setPrice');}
 $('best').textContent=longDur(Math.max(S.best,el))||('0 '+tt('mn'));
}
Object.keys(LN).forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=LN[c];$('lang').appendChild(o);});
$('lang').onchange=function(){L=this.value;S.lang=L;save();lastIdx=-1;render();};
$('tbtn').onclick=function(){view='trophy';window.scrollTo(0,0);render();};
setInterval(tick,1000);
document.addEventListener('visibilitychange',tick);
render();
})();
</script>
</body>
